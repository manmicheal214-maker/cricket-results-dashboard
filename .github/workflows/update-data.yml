name: Update cricket data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-data:
    # Run for human pushes, but never trigger another data-update run from
    # the bot commit that this workflow creates.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch cricket data
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Validate generated data
        run: |
          test -s public/data/matches.json
          node -e "const d=require('./public/data/matches.json'); if(!d.ok || !d.updatedAt) process.exit(1); console.log('Updated:', d.updatedAt);"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/matches.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update cricket results"
            git push
          fi
