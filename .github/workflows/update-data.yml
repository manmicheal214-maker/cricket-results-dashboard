name: Update cricket data and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: 22

jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch current cricket data
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Validate generated data
        run: |
          test -s public/data/matches.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('public/data/matches.json', 'utf8'));
          if (!payload.ok) throw new Error('API response was not successful');
          if (!payload.updatedAt) throw new Error('Missing updatedAt');
          if (!Array.isArray(payload.data)) throw new Error('Expected data to be an array');
          console.log(`Fetched ${payload.data.length} matches at ${payload.updatedAt}`);
          NODE

      - name: Publish generated data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/matches.json
          if git diff --cached --quiet; then
            echo "No data changes to publish"
          else
            git commit -m "data: update cricket matches"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
