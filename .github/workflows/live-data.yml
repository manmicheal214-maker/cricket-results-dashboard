name: Refresh live cricket data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: live-pages-deploy
  cancel-in-progress: true

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fetch live match snapshot
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          FETCH_SCORECARDS: "false"
        run: node scripts/fetch-data.js
      - name: Validate generated data
        run: |
          test -s public/data/matches.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('public/data/matches.json', 'utf8'));
          if (!payload.ok || !Array.isArray(payload.data)) throw new Error('Invalid cricket data');
          console.log(`Live snapshot: ${payload.data.length} matches at ${payload.updatedAt}`);
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
