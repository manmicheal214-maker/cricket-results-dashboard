name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - name: Validate JavaScript
        run: npm run check

      - name: Verify server startup and health endpoint
        env:
          NODE_ENV: test
          PORT: 3000
        run: |
          node server.js > server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
