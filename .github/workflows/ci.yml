name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # This repository's GitHub Pages build does not require npm dependencies.
      # Avoid npm registry downloads here: the runner has repeatedly received
      # Express/Dotenv tarballs whose SHA-512 does not match package-lock.json.
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check src/cricket-api.js
          node --check public/app.js

      - name: Validate static Pages data
        run: |
          test -s public/data/matches.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('public/data/matches.json', 'utf8'));
          if (!payload || typeof payload !== 'object') throw new Error('Invalid matches.json');
          if (!Array.isArray(payload.data)) throw new Error('matches.json data must be an array');
          console.log(`Validated ${payload.data.length} matches`);
          NODE
