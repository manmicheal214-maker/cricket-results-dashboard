name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # This repository's GitHub Pages build does not require npm dependencies.
      # Avoid npm registry/cache access in this static validation job.
      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check server.js
          node --check src/cricket-api.js
          node --check public/app.js

      - name: Validate static Pages data
        run: |
          set -euo pipefail
          test -s public/data/matches.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('public/data/matches.json', 'utf8'));
          if (!payload || typeof payload !== 'object') throw new Error('Invalid matches.json');
          if (!Array.isArray(payload.data)) throw new Error('matches.json data must be an array');
          console.log(`Validated ${payload.data.length} matches`);
          NODE
